[env]
python = "3.11"
node = "20"

[tools]
# mise's registry plugin is "flux2" (not "flux" - that name doesn't resolve
# and was silently failing to install, which meant bench/stages/static.py's
# `flux build kustomization` calls for every knr-ops run hit `NOT FOUND:
# flux` instead of actually validating anything). The installed binary is
# still named `flux`, matching what static.py invokes.
flux2 = "2.5.0"
kustomize = "5.6.0"
konflate = "1.3.0"
crossplane-cli = "1.20.0"
opentofu = "1.8.0"
tflint = "0.53.0"
checkov = "3.3.0"
pulumi = "3.150.0"
kind = "0.26.0"
docker = "27.0"
# chant CLI (@intentius/chant) + its TypeScript toolchain, pinned via mise's
# npm backend. node itself is already pinned above via [env]. Version 5.9.3
# matches what @intentius/chant's own devDependency pins for its build.
"npm:@intentius/chant" = "0.46.0"
"npm:typescript" = "5.9.3"

[python.environments]
default = { require_internet = false }
