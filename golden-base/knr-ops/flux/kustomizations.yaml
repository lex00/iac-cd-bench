apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: myapp-dev
  namespace: flux-system
spec:
  interval: 1m0s
  path: ./overlays/dev
  prune: true
  sourceRef:
    kind: GitRepository
    name: myapp-infra
  targetNamespace: default
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: myapp-prod
  namespace: flux-system
spec:
  interval: 1m0s
  path: ./overlays/prod
  prune: true
  sourceRef:
    kind: GitRepository
    name: myapp-infra
  targetNamespace: default
  dependsOn:
    - name: myapp-dev
