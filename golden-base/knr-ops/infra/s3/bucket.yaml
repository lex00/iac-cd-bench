# ACK s3-controller Bucket (s3.services.k8s.aws) - versioning, SSE, and the
# public-access block are all fields on the single Bucket CR; there's no
# separate BucketPublicAccessBlock kind in this controller (issue #47).
#
# No per-resource `region` or `providerConfigRef`: unlike the Upbound
# provider this replaces, a single ACK s3-controller install targets one AWS
# region via its own controller config, and auth is via IRSA/Pod Identity,
# not a ProviderConfig CR.
apiVersion: s3.services.k8s.aws/v1alpha1
kind: Bucket
metadata:
  name: myapp-assets-dev
  namespace: infra
spec:
  name: myapp-assets-dev
  versioning:
    status: Enabled
  encryption:
    rules:
      - applyServerSideEncryptionByDefault:
          sseAlgorithm: AES256
  publicAccessBlock:
    blockPublicACLs: true
    blockPublicPolicy: true
    ignorePublicACLs: true
    restrictPublicBuckets: true
