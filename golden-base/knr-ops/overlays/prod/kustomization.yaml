# Prod overlay
#
# Cluster patches updated for issue #47's CAPA v1beta2 EKS-managed shape:
# no more KubeadmControlPlane replicas patch - AWSManagedControlPlane has no
# "replicas" field, since AWS itself runs and HA-scales the EKS control
# plane (a CAPA fidelity gap this golden can't paper over; see
# clusters/eksa/controlplane.yaml). AWSMachineTemplate/MachineDeployment
# patches become AWSManagedMachinePool/MachinePool.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../clusters
  - ../../infra
namePrefix: prod-
patches:
  - target:
      kind: AWSManagedMachinePool
      group: infrastructure.cluster.x-k8s.io
      name: myapp-dev-workers
    patch: |
      - op: replace
        path: /spec/instanceType
        value: t3.large
  - target:
      kind: DBInstance
      group: rds.services.k8s.aws
      name: myapp-dev-db
    patch: |
      - op: replace
        path: /spec/dbInstanceClass
        value: db.t3.medium
      - op: replace
        path: /spec/multiAZ
        value: true
  - target:
      kind: Bucket
      group: s3.services.k8s.aws
      name: myapp-assets-dev
    patch: |
      - op: replace
        path: /spec/versioning/status
        value: Enabled
  - target:
      kind: MachinePool
      name: myapp-dev-workers
    patch: |
      - op: replace
        path: /spec/replicas
        value: 4
  - target:
      kind: AWSManagedMachinePool
      group: infrastructure.cluster.x-k8s.io
      name: myapp-dev-workers
    patch: |
      - op: replace
        path: /spec/scaling/maxSize
        value: 4
