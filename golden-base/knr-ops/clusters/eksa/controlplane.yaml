apiVersion: controlplane.cluster.x-k8s.io/v1beta1
kind: KubeadmControlPlane
metadata:
  name: myapp-dev
  namespace: clusters
spec:
  version: v1.31.2
  replicas: 2
  machineTemplate:
    infrastructureRef:
      apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
      kind: AWSMachineTemplate
      name: myapp-dev-controlplane
  kubeadmConfigRef:
    apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
    kind: KubeadmConfig
    name: myapp-dev-kubeadm
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: AWSMachineTemplate
metadata:
  name: myapp-dev-controlplane
  namespace: clusters
spec:
  template:
    spec:
      instanceType: t3.medium
      instanceProfile: controlplane
      iamInstanceProfile: controlplane
