# Prod overlay
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../clusters
  - ../../infra
namePrefix: prod-
patches:
  - target:
      kind: KubeadmControlPlane
      name: myapp-dev
    patch: |
      - op: replace
        path: /spec/replicas
        value: 4
  - target:
      kind: AWSMachineTemplate
      name: myapp-dev-workers
    patch: |
      - op: replace
        path: /spec/template/spec/instanceType
        value: t3.large
  - target:
      kind: Instance
      group: rds.aws.upbound.io
      name: myapp-dev-db
    patch: |
      - op: replace
        path: /spec/forProvider/instanceClass
        value: db.t3.medium
      - op: replace
        path: /spec/forProvider/multiAz
        value: true
  - target:
      kind: Deployment
      name: myapp
    patch: |
      - op: replace
        path: /spec/replicas
        value: 4
  - target:
      kind: Bucket
      group: s3.aws.upbound.io
      name: myapp-assets-dev
    patch: |
      - op: replace
        path: /spec/forProvider/versioningConfiguration/status
        value: Enabled
      - op: add
        path: /spec/forProvider/replicationConfiguration
        value:
          role: arn:aws:iam::ACCOUNT:role/s3-replication
          rules:
            - id: replicate-to-west
              status: Enabled
              priority: 1
              filter:
                prefix: ''
              destination:
                bucket: arn:aws:s3:::myapp-assets-us-west-2
                replicationTime:
                  status: Enabled
                  time:
                    minutes: 15
                metrics:
                  status: Enabled
                  eventThreshold:
                    minutes: 15
                storageClass: STANDARD
              storageClass: STANDARD
      - op: replace
        path: /metadata/name
        value: myapp-assets-dev
  - target:
      kind: MachineDeployment
      name: myapp-dev-workers
    patch: |
      - op: replace
        path: /spec/replicas
        value: 4
